<style>
    .bb-dropdown {
        cursor: pointer;
    }

    .bb-dropdown .title-wrapper {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .bb-dropdown.active .plus,
    .bb-dropdown .minus {
        display: none;
    }

    .bb-dropdown .plus,
    .bb-dropdown.active .minus {
        display: block;
    }

    .bb-dropdown .description {
        overflow: hidden;
        height: 0;
        transition: height 0.4s ease;
    }
</style>



<div class="dropdown-wrapper">

    <div class="bb-dropdown">
        <div class="title-wrapper">
            <h4 class="title">Your Dropdown Title Here</h4>
            <img class="plus" src="/wp-content/uploads/2025/11/plus.svg" alt="">
            <img class="minus" src="/wp-content/uploads/2025/11/minus.svg" alt="">
        </div>
        <div class="description">
            <p>Your Description Here</p>
        </div>
    </div>

</div>


<script>
    function initializeDropdown() {
        const dropdowns = document.querySelectorAll('.bb-dropdown');
        if (!dropdowns.length) return;

        dropdowns.forEach(dropdown => {
            const desc = dropdown.querySelector('.description');
            if (!desc) return;

            dropdown.addEventListener('click', () => {
                try {
                    const isActive = dropdown.classList.toggle('active');
                    desc.style.height = isActive ? desc.scrollHeight + 'px' : '0';
                } catch (err) {
                    console.error('Dropdown toggle failed:', err);
                }
            });
        });
    }

    document.addEventListener('DOMContentLoaded', initializeDropdown);
</script>
