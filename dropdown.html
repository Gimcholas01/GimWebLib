<style>
    .bb-dropdown {
        cursor: pointer;
    }

    .bb-dropdown .description {
        overflow: hidden;
        height: 0;
        transition: height 0.4s ease;
    }
</style>



<div class="dropdown-wrapper">

    <div class="bb-dropdown">
        <h4 class="title">Your Dropdown Title Here</h4>
        <div class="description">
            <p>Your Description Here</p>
        </div>
    </div>

</div>


<script>
    function initializeDropdown() {
        const dropdowns = document.querySelectorAll('.bb-dropdown');
        if (!dropdowns.length) return;

        dropdowns.forEach(dropdown => {
            const desc = dropdown.querySelector('.description');
            if (!desc) return;

            dropdown.addEventListener('click', () => {
                try {
                    const isActive = dropdown.classList.toggle('active');
                    desc.style.height = isActive ? desc.scrollHeight + 'px' : '0';
                } catch (err) {
                    console.error('Dropdown toggle failed:', err);
                }
            });
        });
    }

    document.addEventListener('DOMContentLoaded', initializeDropdown);
</script>
